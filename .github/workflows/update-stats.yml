name: Atualizar estatísticas

on:
  schedule:
    - cron: "0 6 * * *"     # todo dia às 6h (horário UTC)
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar números e atualizar o SVG
        run: python update_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: kauansilva1472
      - name: Salvar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          git diff --cached --quiet || git commit -m "Atualiza estatísticas"
          git push